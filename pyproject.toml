[project]
name = "internship-avito-api-tests"
version = "0.1.0"
description = "API autotests for qa-internship.avito.com"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "requests>=2.31.0",
    "pytest>=7.4.0",
    "allure-pytest>=2.13.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["."]
extend-exclude = [".git", ".venv", "allure-results"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = ["E501"]  # line length handled separately

[tool.ruff.lint.isort]
known-first-party = ["models", "helpers", "api_client", "domain"]

[tool.ruff.format]
quote-style = "double"
